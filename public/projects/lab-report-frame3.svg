<svg width="720" height="400" viewBox="0 0 720 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Window background -->
  <rect width="720" height="400" rx="8" fill="#F8FAFC"/>
  
  <!-- Left mini sidebar -->
  <rect width="90" height="400" fill="#0F172A" rx="8 0 0 8"/>
  <text x="14" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Lab Report</text>
  
  <text x="24" y="70" font-family="sans-serif" font-size="10" fill="#94A3B8">Upload</text>
  <text x="24" y="100" font-family="sans-serif" font-size="10" fill="#64748B">History</text>
  <text x="24" y="130" font-family="sans-serif" font-size="10" fill="#64748B">Analysis</text>
  <text x="24" y="160" font-family="sans-serif" font-size="10" fill="#64748B">Settings</text>

  <!-- Top bar -->
  <rect x="90" y="0" width="630" height="38" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="110" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#64748B">Dashboard</text>
  <circle cx="680" cy="20" r="10" fill="#E2E8F0"/>
  <circle cx="650" cy="20" r="10" fill="#E2E8F0"/>

  <!-- Left: Upload Box -->
  <rect x="114" y="60" width="280" height="310" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="134" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Lab Report Interpreter</text>
  <text x="134" y="112" font-family="sans-serif" font-size="10" fill="#64748B">Upload a lab report to extract and interpret key insights using OCR and machine learning.</text>

  <!-- Drag drop zone -->
  <rect x="134" y="140" width="240" height="150" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="238" y="170" width="32" height="36" rx="4" fill="#E2E8F0"/>
  <path d="M 246 195 L 254 185 L 262 195 Z" fill="#64748B"/>
  <text x="254" y="226" font-family="sans-serif" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">Drop a file here</text>
  <text x="254" y="242" font-family="sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">PDF, JPG, PNG (Max 10MB)</text>

  <rect x="180" y="306" width="148" height="32" rx="4" fill="#0284C7"/>
  <text x="254" y="326" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Upload Report</text>

  <!-- Right: Analysis Result -->
  <rect x="414" y="60" width="286" height="310" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="434" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#0F172A">Analysis Result</text>
  
  <!-- Row 1: Blood Glucose -->
  <circle cx="442" cy="122" r="4" fill="#0284C7"/>
  <text x="454" y="126" font-family="sans-serif" font-size="11" fill="#334155">Blood Glucose</text>
  <text x="590" y="126" font-family="monospace" font-size="11" font-weight="600" fill="#0F172A">98 mg/dL</text>
  <rect x="640" y="114" width="46" height="18" rx="3" fill="#DCFCE7"/>
  <text x="663" y="127" font-family="sans-serif" font-size="9" font-weight="600" fill="#15803D" text-anchor="middle">Normal</text>
  <line x1="434" y1="142" x2="686" y2="142" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Row 2: Cholesterol -->
  <circle cx="442" cy="162" r="4" fill="#EF4444"/>
  <text x="454" y="166" font-family="sans-serif" font-size="11" fill="#334155">Cholesterol</text>
  <text x="590" y="166" font-family="monospace" font-size="11" font-weight="600" fill="#0F172A">210 mg/dL</text>
  <rect x="640" y="154" width="46" height="18" rx="3" fill="#FEE2E2"/>
  <text x="663" y="167" font-family="sans-serif" font-size="9" font-weight="600" fill="#B91C1C" text-anchor="middle">High</text>
  <line x1="434" y1="182" x2="686" y2="182" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Row 3: Hemoglobin -->
  <circle cx="442" cy="202" r="4" fill="#0284C7"/>
  <text x="454" y="206" font-family="sans-serif" font-size="11" fill="#334155">Hemoglobin</text>
  <text x="590" y="206" font-family="monospace" font-size="11" font-weight="600" fill="#0F172A">13.2 g/dL</text>
  <rect x="640" y="194" width="46" height="18" rx="3" fill="#DCFCE7"/>
  <text x="663" y="207" font-family="sans-serif" font-size="9" font-weight="600" fill="#15803D" text-anchor="middle">Normal</text>
  <line x1="434" y1="222" x2="686" y2="222" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Row 4: Vitamin D -->
  <circle cx="442" cy="242" r="4" fill="#F59E0B"/>
  <text x="454" y="246" font-family="sans-serif" font-size="11" fill="#334155">Vitamin D</text>
  <text x="590" y="246" font-family="monospace" font-size="11" font-weight="600" fill="#0F172A">16 ng/mL</text>
  <rect x="640" y="234" width="46" height="18" rx="3" fill="#FEF3C7"/>
  <text x="663" y="247" font-family="sans-serif" font-size="9" font-weight="600" fill="#B45309" text-anchor="middle">Low</text>
  <line x1="434" y1="262" x2="686" y2="262" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Summary text box -->
  <text x="434" y="286" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0F172A">Summary</text>
  <text x="434" y="304" font-family="sans-serif" font-size="9.5" fill="#475569">Cholesterol level is slightly higher than normal range. Consider lifestyle changes and consult a doctor.</text>
  <text x="434" y="338" font-family="monospace" font-size="9" fill="#0284C7">> OCR ENGINE: Processing complete</text>
</svg>