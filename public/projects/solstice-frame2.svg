<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Window background -->
  <rect width="800" height="500" fill="#0E080D" rx="4" />
  
  <!-- Outer hairline border in accent color -->
  <rect x="0.5" y="0.5" width="799" height="499" rx="3.5" stroke="#521C42" stroke-width="1" stroke-opacity="0.9" />

  <!-- Window Header / Titlebar -->
  <rect x="0" y="0" width="800" height="42" fill="#0D0D10" rx="4 4 0 0" />
  <line x1="0" y1="42" x2="800" y2="42" stroke="#252528" stroke-width="1" />

  <!-- Minimal window dots -->
  <circle cx="24" cy="21" r="4.5" fill="#3A3A40" />
  <circle cx="40" cy="21" r="4.5" fill="#3A3A40" />
  <circle cx="56" cy="21" r="4.5" fill="#3A3A40" />

  <!-- Window title / URL -->
  <rect x="180" y="10" width="440" height="22" fill="#18181D" rx="2" stroke="#2B2B32" stroke-width="1" />
  <text x="400" y="25" fill="#8E8E98" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="10" text-anchor="middle" letter-spacing="0.5">solstice typography.local</text>

  <!-- Status pill -->
  <rect x="710" y="12" width="66" height="18" fill="#521C42" fill-opacity="0.25" stroke="#521C42" stroke-width="1" rx="2" />
  <text x="743" y="24" fill="#FFFFFF" font-family="monospace" font-size="9" font-weight="600" text-anchor="middle">ACTIVE</text>

  
      <!-- Toolbar -->
      <rect x="24" y="60" width="752" height="48" fill="#191118" stroke="#521C42" stroke-width="1" rx="2" />
      <text x="44" y="90" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Variable Bezier Interpolation Studio</text>
      <text x="420" y="90" fill="#E879F9" font-family="monospace" font-size="10">GLYPH: U+0041 ('A')</text>
      <text x="620" y="90" fill="#F0ABFC" font-family="monospace" font-size="10">NODES: 16 BEZIER PTS</text>

      <!-- Canvas Editor Area -->
      <rect x="24" y="120" width="510" height="356" fill="#130C12" stroke="#521C42" stroke-width="1" rx="2" />
      
      <!-- Coordinate Grid -->
      <line x1="24" y1="360" x2="534" y2="360" stroke="#2D1726" stroke-width="1" />
      <line x1="24" y1="200" x2="534" y2="200" stroke="#2D1726" stroke-dasharray="2 4" stroke-width="1" />
      <line x1="24" y1="440" x2="534" y2="440" stroke="#521C42" stroke-width="1" />
      <text x="40" y="434" fill="#A25788" font-family="monospace" font-size="9">BASELINE 0</text>
      <text x="40" y="354" fill="#A25788" font-family="monospace" font-size="9">X-HEIGHT 500</text>
      <text x="40" y="194" fill="#A25788" font-family="monospace" font-size="9">CAP-HEIGHT 720</text>

      <!-- Rendered Variable Glyph -->
      <path d="M 180 430 L 260 180 L 340 430 L 300 430 L 285 380 L 235 380 L 220 430 Z M 245 345 L 275 345 L 260 280 Z" 
            fill="#F5D0FE" fill-opacity="0.15" stroke="#F0ABFC" stroke-width="4.3" />

      <!-- Interactive Bezier Control Handles -->
      <circle cx="260" cy="180" r="5" fill="#E879F9" stroke="#FFFFFF" stroke-width="1.5" />
      <line x1="220" y1="210" x2="260" y2="180" stroke="#E879F9" stroke-dasharray="2 2" stroke-width="1" />
      <line x1="300" y1="210" x2="260" y2="180" stroke="#E879F9" stroke-dasharray="2 2" stroke-width="1" />
      <rect x="215" y="205" width="10" height="10" fill="#FFFFFF" stroke="#E879F9" stroke-width="1" />
      <rect x="295" y="205" width="10" height="10" fill="#FFFFFF" stroke="#E879F9" stroke-width="1" />

      <!-- Parameters Panel Right -->
      <rect x="548" y="120" width="228" height="356" fill="#150E14" stroke="#521C42" stroke-width="1" rx="2" />
      <text x="568" y="152" fill="#E879F9" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="1">AXIS TUNING</text>
      
      <!-- Weight Slider -->
      <text x="568" y="184" fill="#D8B4E2" font-family="monospace" font-size="10">wght (Weight): 850</text>
      <rect x="568" y="196" width="188" height="6" fill="#2E1828" rx="2" />
      <rect x="568" y="196" width="177.55555555555554" height="6" fill="#E879F9" rx="2" />

      <!-- Slant Slider -->
