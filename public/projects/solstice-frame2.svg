      <rect x="568" y="246" width="188" height="6" fill="#2E1828" rx="2" />
      <rect x="568" y="246" width="131.6" height="6" fill="#E879F9" rx="2" />

      <!-- Optical Size Slider -->
      <text x="568" y="284" fill="#D8B4E2" font-family="monospace" font-size="10">opsz (Optical): 72pt</text>
      <rect x="568" y="296" width="188" height="6" fill="#2E1828" rx="2" />
      <rect x="568" y="296" width="188" height="6" fill="#E879F9" rx="2" />

      <text x="568" y="340" fill="#935783" font-family="monospace" font-size="9">EXPORT FORMAT</text>
      <rect x="568" y="352" width="188" height="32" fill="#241321" stroke="#521C42" stroke-width="1" rx="2" />
      <text x="580" y="372" fill="#FFFFFF" font-family="monospace" font-size="10">WOFF2 + OTF CFF2</text>

      <text x="568" y="416" fill="#935783" font-family="monospace" font-size="9">CANVAS RENDER</text>
      <text x="568" y="432" fill="#34D399" font-family="monospace" font-size="10">FPS: 60.0 (WebGPU)</text>
    
</svg>