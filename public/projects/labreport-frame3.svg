<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="380" rx="8" fill="#F8FAFC" />
  
  <!-- Left mini sidebar -->
  <rect x="0" y="0" width="90" height="380" fill="#0F172A" />
  <circle cx="20" cy="24" r="6" fill="#38BDF8" />
  <text x="32" y="27" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Lab Report</text>
  
  <rect x="8" y="50" width="74" height="24" rx="3" fill="#1E293B" />
  <text x="20" y="66" fill="#38BDF8" font-family="monospace" font-size="9">⇪ Upload</text>
  <text x="20" y="96" fill="#64748B" font-family="monospace" font-size="9">⏱ History</text>
  <text x="20" y="126" fill="#64748B" font-family="monospace" font-size="9">☵ Analysis</text>
  <text x="20" y="156" fill="#64748B" font-family="monospace" font-size="9">⚙ Settings</text>

  <!-- Upload zone -->
  <rect x="106" y="20" width="260" height="340" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  <text x="124" y="48" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Lab Report Interpreter</text>
  <text x="124" y="66" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Upload a lab report to extract and interpret key insights using OCR and machine learning.</text>

  <!-- Drop area -->
  <rect x="124" y="88" width="224" height="140" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="4 4" />
  <circle cx="236" cy="136" r="16" fill="#EFF6FF" />
  <text x="236" y="142" fill="#2563EB" font-family="sans-serif" font-size="16" text-anchor="middle">📄</text>
  <text x="236" y="166" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Drop a file here</text>
  <text x="236" y="180" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" text-anchor="middle">PDF, JPG, PNG (Max 10MB)</text>

  <rect x="176" y="244" width="120" height="30" rx="4" fill="#2563EB" />
  <text x="236" y="263" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Upload Report</text>

  <!-- Analysis Results Right -->
  <rect x="380" y="20" width="206" height="340" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  <text x="396" y="48" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Analysis Result</text>

  <!-- Rows -->
  <g transform="translate(396, 70)">
    <circle cx="6" cy="10" r="4" fill="#10B981" />
    <text x="16" y="14" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Blood Glucose</text>
    <text x="116" y="14" fill="#0F172A" font-family="monospace" font-size="9" font-weight="600">98 mg/dL</text>
    <rect x="146" y="4" width="38" height="16" rx="3" fill="#D1FAE5" />
    <text x="165" y="15" fill="#065F46" font-family="monospace" font-size="8" text-anchor="middle">Normal</text>

    <!-- Cholesterol -->
    <circle cx="6" cy="38" r="4" fill="#EF4444" />
    <text x="16" y="42" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Cholesterol</text>
    <text x="116" y="42" fill="#0F172A" font-family="monospace" font-size="9" font-weight="600">210 mg/dL</text>
    <rect x="146" y="32" width="38" height="16" rx="3" fill="#FEE2E2" />
    <text x="165" y="43" fill="#991B1B" font-family="monospace" font-size="8" text-anchor="middle">High</text>

    <!-- Hemoglobin -->
    <circle cx="6" cy="66" r="4" fill="#10B981" />
    <text x="16" y="70" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Hemoglobin</text>
    <text x="116" y="70" fill="#0F172A" font-family="monospace" font-size="9" font-weight="600">13.2 g/dL</text>
    <rect x="146" y="60" width="38" height="16" rx="3" fill="#D1FAE5" />
    <text x="165" y="71" fill="#065F46" font-family="monospace" font-size="8" text-anchor="middle">Normal</text>

    <!-- Vitamin D -->
    <circle cx="6" cy="94" r="4" fill="#F59E0B" />
    <text x="16" y="98" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Vitamin D</text>
    <text x="116" y="98" fill="#0F172A" font-family="monospace" font-size="9" font-weight="600">16 ng/mL</text>
    <rect x="146" y="88" width="38" height="16" rx="3" fill="#FEF3C7" />
    <text x="165" y="99" fill="#92400E" font-family="monospace" font-size="8" text-anchor="middle">Low</text>
  </g>

  <!-- Summary text box -->
  <rect x="396" y="210" width="174" height="130" rx="4" fill="#F8FAFC" stroke="#E2E8F0" />
  <text x="408" y="232" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Summary</text>
  <text x="408" y="250" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5">Cholesterol level is slightly higher</text>
  <text x="408" y="264" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5">than normal range. Consider lifestyle</text>
  <text x="408" y="278" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5">changes and consult a doctor.</text>

  <rect x="408" y="296" width="150" height="24" rx="3" fill="#10B981" fill-opacity="0.15" />
  <text x="483" y="312" fill="#047857" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">STATUS: AI OCR COMPLETE</text>
</svg>