<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="420" viewBox="0 0 400 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep Space Canvas -->
  <rect width="400" height="420" rx="8" fill="#090D16" />
  
  <!-- Subtle starfield -->
  <circle cx="40" cy="50" r="1.5" fill="#FFFFFF" fill-opacity="0.8" />
  <circle cx="120" cy="80" r="1" fill="#FFFFFF" fill-opacity="0.6" />
  <circle cx="280" cy="40" r="1.5" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="350" cy="90" r="1" fill="#FFFFFF" fill-opacity="0.5" />
  <circle cx="60" cy="200" r="1" fill="#FFFFFF" fill-opacity="0.7" />
  <circle cx="340" cy="240" r="1.5" fill="#FFFFFF" fill-opacity="0.8" />
  <circle cx="90" cy="350" r="1" fill="#FFFFFF" fill-opacity="0.4" />
  <circle cx="310" cy="370" r="1.5" fill="#FFFFFF" fill-opacity="0.7" />

  <!-- Top bar -->
  <text x="24" y="32" fill="#E2E8F0" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1">SPACE SHOOTER</text>
  <text x="280" y="32" fill="#94A3B8" font-family="monospace" font-size="8">Play</text>
  <text x="315" y="32" fill="#94A3B8" font-family="monospace" font-size="8">Leaderboard</text>
  <text x="375" y="32" fill="#94A3B8" font-family="monospace" font-size="8" text-anchor="end">About</text>

  <!-- Big Title -->
  <text x="200" y="100" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="1.5">SPACE</text>
  <text x="200" y="124" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="1.5">SHOOTER</text>
  
  <text x="200" y="146" fill="#38BDF8" font-family="monospace" font-size="8" text-anchor="middle" letter-spacing="2">DODGE. SHOOT. SURVIVE.</text>

  <!-- PLAY GAME Button -->
  <rect x="146" y="164" width="108" height="32" rx="4" fill="#2563EB" />
  <text x="200" y="184" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">PLAY GAME</text>

  <!-- Asteroid 1 -->
  <circle cx="70" cy="140" r="16" fill="#334155" stroke="#475569" stroke-width="1.5" />
  <circle cx="65" cy="136" r="3" fill="#1E293B" />
  <circle cx="75" cy="145" r="4" fill="#1E293B" />

  <!-- Asteroid 2 -->
  <circle cx="330" cy="200" r="14" fill="#334155" stroke="#475569" stroke-width="1.5" />
  <circle cx="325" cy="197" r="3" fill="#1E293B" />

  <!-- Rocket Ship -->
  <g transform="translate(175, 270)">
    <!-- Flames -->
    <path d="M 20 54 L 25 70 L 30 54 Z" fill="#F59E0B" />
    <path d="M 22 54 L 25 64 L 28 54 Z" fill="#EF4444" />
    <!-- Wings -->
    <path d="M 5 35 L 25 20 L 25 50 Z" fill="#DC2626" />
    <path d="M 45 35 L 25 20 L 25 50 Z" fill="#DC2626" />
    <!-- Body -->
    <path d="M 25 0 L 15 45 L 35 45 Z" fill="#F8FAFC" />
    <!-- Cockpit glass -->
    <circle cx="25" cy="22" r="5" fill="#38BDF8" />
  </g>

  <!-- Space dust / grid -->
  <line x1="0" y1="419" x2="400" y2="419" stroke="#1E293B" />
</svg>