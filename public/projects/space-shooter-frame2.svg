<svg width="500" height="440" viewBox="0 0 500 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep space background -->
  <rect width="500" height="440" rx="8" fill="#070B14"/>
  
  <!-- Stars -->
  <circle cx="60" cy="50" r="1.5" fill="#FFFFFF"/>
  <circle cx="120" cy="90" r="1" fill="#93C5FD"/>
  <circle cx="210" cy="40" r="2" fill="#FFFFFF"/>
  <circle cx="340" cy="70" r="1" fill="#FFFFFF"/>
  <circle cx="440" cy="110" r="1.5" fill="#BAE6FD"/>
  <circle cx="80" cy="190" r="1" fill="#FFFFFF"/>
  <circle cx="430" cy="220" r="2" fill="#93C5FD"/>
  <circle cx="150" cy="290" r="1.5" fill="#FFFFFF"/>

  <!-- Top Bar -->
  <text x="24" y="32" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="1">SPACE SHOOTER</text>
  <text x="320" y="32" font-family="sans-serif" font-size="9" fill="#94A3B8">Play</text>
  <text x="360" y="32" font-family="sans-serif" font-size="9" fill="#94A3B8">Leaderboard</text>
  <text x="440" y="32" font-family="sans-serif" font-size="9" fill="#94A3B8">About</text>

  <!-- Big Title -->
  <text x="250" y="110" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SPACE</text>
  <text x="250" y="138" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SHOOTER</text>
  <text x="250" y="165" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="9" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="2">DODGE. SHOOT. SURVIVE.</text>

  <!-- Play Game Button -->
  <rect x="180" y="185" width="140" height="34" rx="4" fill="#0284C7"/>
  <text x="250" y="206" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PLAY GAME</text>

  <!-- Floating Asteroid Left -->
  <circle cx="80" cy="160" r="18" fill="#334155" stroke="#475569" stroke-width="2"/>
  <circle cx="74" cy="156" r="4" fill="#1E293B"/>
  <circle cx="86" cy="166" r="3" fill="#1E293B"/>

  <!-- Floating Asteroid Right -->
  <circle cx="420" cy="190" r="22" fill="#334155" stroke="#475569" stroke-width="2"/>
  <circle cx="414" cy="184" r="5" fill="#1E293B"/>

  <!-- Laser Bullets -->
  <line x1="246" y1="160" x2="246" y2="180" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="254" y1="160" x2="254" y2="180" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

  <!-- Retro Spaceship -->
  <g transform="translate(225, 324)">
    <!-- Main hull -->
    <path d="M 25 0 L 38 40 L 32 50 L 18 50 L 12 40 Z" fill="#F8FAFC"/>
    <!-- Cockpit -->
    <ellipse cx="25" cy="24" rx="4" ry="10" fill="#38BDF8"/>
    <!-- Wings left & right -->
    <path d="M 12 36 L 0 54 L 12 48 Z" fill="#DC2626"/>
    <path d="M 38 36 L 50 54 L 38 48 Z" fill="#DC2626"/>
    <!-- Thruster flame -->
    <polygon points="21,50 25,64 29,50" fill="#F59E0B"/>
    <polygon points="23,50 25,58 27,50" fill="#EF4444"/>
  </g>

  <!-- Ground / Starfield glow -->
  <circle cx="250" cy="480" r="160" fill="#0284C7" fill-opacity="0.15"/>
</svg>